name: GridLab

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK to GridLab.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GridLab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridLab
          path: app/build/outputs/apk/debug/GridLab.apk
          if-no-files-found: error
