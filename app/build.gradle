plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.customgridlines'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.customgridlines"
        minSdk 10
        targetSdk 10
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debugConfig {
            if (file("${rootDir}/debug.keystore").exists()) {
                storeFile file("${rootDir}/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
        release {
            minifyEnabled false
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
